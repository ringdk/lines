# This app's values for Serafina's app template (serafina/templates/app).
# In her checkout, `uv run python scripts/app_template.py check <this repo>`
# compares the two, and `scripts/add_app.py` reads it to add the app to her
# config.

[app]
name = "lines"
package = "lines"
env = "LINES_"
title = "Lines"
tools = "lines_"
port = 8794
icon = "drama"
# How it's deployed (serafina/docs/APPS.md): "sealed", signed commits into a
# root-owned checkout, for anything personal; or "light", from your own
# checkout with no signing key, only for an app that keeps nothing personal.
tier = "light"
# Who sees it in her apps row: the same people as LINES_USERS.
users = ["ringdk@gmail.com"]
# Optional, and only where one fits: personas from integration/serafina
# (<id>.persona.md) that the chat panel beside this app offers, the first
# its default. Most apps offer none.
personas = ["scene-partner"]

# Template files this repo keeps somewhere else: "template path" = "path here".
# A directory maps everything under it.
[paths]

# Template files this repo differs from on purpose: "template path" = "why".
# `check` shows the reason instead of the difference (--all shows both).
[deviations]
"deploy/lines.service" = "reaches the internet to fetch Google Docs shared by link: IPAddressDeny lists the private ranges, the tailnet, link-local, multicast and NAT64 instead of any"
