[project]
name = "lines"
version = "0.1.0"
description = "Lines, an app beside Serafina"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyrage>=1.3.0",
  "sqlcipher3>=0.5.0",
  "pymupdf>=2.1",
  "httpx>=0.28.1",
]

[project.scripts]
lines = "lines.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruamel.yaml>=0.18",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lines"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The tests' own imports in a block of their own, so a file the template
# shares sorts the same whatever the app is called.
[tool.ruff.lint.isort]
known-local-folder = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
